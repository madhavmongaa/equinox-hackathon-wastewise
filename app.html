<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F8EF" />
    <!-- apply the saved theme before first paint (light by default); see src/lib/theme.ts -->
    <script>
      try {
        if (localStorage.getItem("wastewise.theme.v1") === "dark") {
          document.documentElement.dataset.theme = "dark"
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0C130F")
        }
      } catch (e) {}
    </script>
    <meta name="description" content="WasteWise — sort smarter, waste less. AI waste-sorting assistant for the Zenith campus." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600&family=Inter+Tight:wght@700&display=swap" rel="stylesheet" />
    <title>WasteWise — Sort smarter. Waste less.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
